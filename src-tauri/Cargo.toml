[package]
name = "workbuddy-pet"
version = "1.0.4"
description = "WorkBuddy Pet - 桌面宠物应用（独立 Tauri 2 应用）"
authors = ["xiaoheQvQ"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "workbuddy_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 核心
# - protocol-asset: 允许前端通过 convertFileSrc 加载本地精灵图
# - macos-private-api: macOS 透明无边框窗口（桌面宠物悬浮窗所需）
# - tray-icon: 系统托盘（TrayIconBuilder / menu）
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
# 文件选择器（导入本地宠物精灵图）
tauri-plugin-dialog = "2"
# 应用内自动更新（配合 GitHub Release 签名验证）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时（异步文件 I/O）
tokio = { version = "1", features = ["full"] }

# 时间处理（版本号时间戳）
chrono = { version = "0.4", features = ["serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "2"
anyhow = "1"

# HTTP 客户端（在线宠物市场：拉取 petdex 清单 + 下载精灵图）
# rustls-tls: 纯 Rust TLS，免去 OpenSSL 系统依赖，三平台构建一致
# system-proxy: 读取操作系统代理设置（Windows 注册表 / macOS 系统配置）。
#   它在 reqwest 的 default 特性里，关掉 default-features 后必须显式加回，
#   否则只会读 HTTPS_PROXY 等环境变量；企业网/代理环境（如系统代理 127.0.0.1:7890）
#   下直连 petdex.dev 会超时，表现为「在线市场不可用」。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "system-proxy",
] }

# 本地 HTTP 服务（接收 WorkBuddy hook 转发的事件）
axum = "0.7"
# 进程枚举（进程管理面板：名称 / PID / 内存 / CPU）
# 仅用 system 模块（进程 + CPU 采样），关闭默认特性以减少编译面。
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# 定位 ~/.workbuddy 等用户目录
dirs = "5"
# 只读访问 WorkBuddy SQLite 统计库（token 使用量查询）
# bundled: 内嵌 SQLite 编译，保证跨平台一致性（无需系统安装 sqlite3）
rusqlite = { version = "0.31", features = ["bundled"] }

# MCP Bridge（仅 debug 构建启用，供 Tauri MCP 端到端测试）
tauri-plugin-mcp-bridge = "0.12"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# wry #1752 修复：WKWebView URL 为 nil 时 unwrap panic（macOS）。
# mcp-bridge 枚举窗口时触发；上游 PR #1753 (Buncys/wry:fix/macos-url-unwrap) 尚未合并发布，
# 通过 patch 提前应用。合并发布后可移除此段。
[patch.crates-io]
wry = { git = "https://github.com/Buncys/wry.git", branch = "fix/macos-url-unwrap" }
