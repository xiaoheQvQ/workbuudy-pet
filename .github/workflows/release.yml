name: Release

# 触发方式：
#   1) 推送形如 v1.0.5 的 tag（推荐，版本号需与 tauri.conf.json 的 version 一致）
#   2) 在 GitHub 网页 Actions 面板手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ''
          - platform: windows-latest
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action 会依次完成：调用 pnpm tauri build -> 收集安装包与 .sig
      # -> 创建/更新 Release -> 生成并上传 latest.json（自动更新清单）
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'WorkBuddy-PET v__VERSION__'
          releaseBody: |
            自动构建发布，包含 Windows / macOS / Linux 安装包与更新签名文件。
            应用内「下载更新」会通过 latest.json 自动获取本版本。
          # 首次试跑用 true：生成草稿 Release，确认各平台产物与 latest.json 无误后
          # 在 Releases 页面点 Publish。稳定后改回 false，实现推 tag 即自动发布。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
