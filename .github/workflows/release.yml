name: Release

# 触发方式：
#   1) 推送形如 v1.0.5 的 tag（推荐，版本号需与 tauri.conf.json 的 version 一致）
#   2) 在 GitHub 网页 Actions 面板手动触发
#
# 说明：当前只构建 Windows (NSIS 安装包)。
# 如需追加 macOS / Linux，在 jobs.publish 上加回 strategy.matrix 即可，
# 并同步移除下面 tauri-action 的 `--bundles nsis` 参数。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action 会依次完成：调用 pnpm tauri build -> 收集安装包与 .sig
      # -> 创建/更新 Release -> 生成并上传 latest.json（自动更新清单）
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'WorkBuddy-PET v__VERSION__'
          releaseBody: |
            自动构建发布，包含 Windows 安装包与更新签名文件。
            应用内「下载更新」会通过 latest.json 自动获取本版本。
          # 自动发布。若想改为「先人工审核再公开」，把这里改成 true，
          # CI 会产出草稿 Release，需在 Releases 页面手动点 Publish。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # 只产出 NSIS 安装包（tauri.conf.json 里还配了 dmg/app/deb/appimage）
          args: '--bundles nsis'
